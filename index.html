<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyijon, iltimos! 🌊🥺</title>
  <!-- Tailwind CSS va Canvas Confetti CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(-5%); }
      50% { transform: translateY(0); }
    }
    .animate-bounce-slow {
      animation: bounce-slow 2s infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center p-4 font-sans overflow-x-hidden">

  <div id="card" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border border-white/50 relative">
    
    <!-- Sarlavha -->
    <h1 id="title" class="text-2xl md:text-3xl font-extrabold text-blue-900 mb-4 animate-bounce-slow">
      Jondan aziz Oyijonim, ruxsat bering! 🌊🥺
    </h1>

    <!-- GIF / Rasm -->
    <div class="my-4 flex justify-center">
      <img 
        id="main-img" 
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pjdWlsOHp4bm82ZDVsYmE1ZHA1OHFuc3c4ZW9yd3R4eGx6eDVmOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L952342pdD5Zu/giphy.gif" 
        alt="Pleading Cat" 
        class="rounded-2xl h-48 w-48 object-cover shadow-md border-4 border-white transition-all duration-300"
      />
    </div>

    <!-- Matn -->
    <p id="desc" class="text-gray-700 text-base md:text-lg mb-6 leading-relaxed font-medium">
      Kun juda issiq bo'lib ketdi... Va'da beraman: juda ehtiyot bo'laman, o'z vaqtida qaytaman va barcha aytganingizni qilaman! 🥹✨
    </p>

    <!-- Tugmalar -->
    <div id="btn-container" class="flex flex-col sm:flex-row items-center justify-center gap-4 min-h-[100px] relative">
      
      <!-- HA Tugmasi -->
      <button 
        id="yes-btn" 
        onclick="grantPermission()"
        class="w-full sm:w-auto bg-green-500 hover:bg-green-600 active:scale-95 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all duration-200 text-lg z-10"
      >
        Mayli, boraqol! ❤️
      </button>

      <!-- YO'Q Tugmasi (Qochadigan) -->
      <button 
        id="no-btn" 
        onmouseover="moveButton()" 
        onclick="moveButton()"
        class="w-full sm:w-auto bg-red-500 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all duration-150 text-lg sm:absolute"
      >
        Yo'q, bo'lmaydi! 😜
      </button>

    </div>

  </div>

  <script>
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const mainImg = document.getElementById('main-img');

    // "Yo'q" tugmasini qochirish funksiyasi
    function moveButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
      
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${Math.max(20, x)}px`;
      noBtn.style.top = `${Math.max(20, y)}px`;
    }

    // "Ruxsat" berilganda ishlaydigan funksiya
    function grantPermission() {
      // Konfetti otish
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Mazmunni o'zgartirish
      title.innerText = "RAHMAT, OYIJON! 🎉 MASHHOURLARNING ENG YAXSHISISIZ! ❤️";
      title.className = "text-2xl md:text-3xl font-black text-pink-600 mb-4 animate-pulse";
      
      desc.innerText = "Ura-a-a! Cho'milishga ketdim! Va'damda turaman! 🏊‍♂️💨";
      
      // Rasmni xursand GIFga almashtirish
      mainImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbm41dWJmNXUzaW4ybjlzcnMyeXJqbnBmdnBqbnMzaXg0bWQ2ajJ2dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13G7mmmGPN95v2/giphy.gif";
      
      // Tugmalarni yashirish
      document.getElementById('btn-container').innerHTML = `
        <div class="bg-green-100 text-green-800 font-bold p-4 rounded-2xl border border-green-300 w-full text-center">
          Ruxsat berildi! ✅ 🏖️
        </div>
      `;
    }
  </script>
</body>
</html>
